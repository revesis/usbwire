[workspace]
resolver = "3"
members = ["crates/proto", "crates/net", "crates/server", "crates/client", "crates/winswap", "crates/udpdelay", "crates/fidoping"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
bytes = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nusb = { version = "0.2", features = ["tokio"] }
spake2 = "0.4"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"
serde_json = "1"
humantime = "2"
windows-service = "0.8"
usbwire-proto = { path = "crates/proto" }
usbwire-net = { path = "crates/net" }
