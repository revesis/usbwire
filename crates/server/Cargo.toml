[package]
name = "usbwire-server"
version.workspace = true
edition.workspace = true
license.workspace = true

# Built as a normal binary everywhere, and also as a cdylib so the Android
# bridge app can run the server in-process over JNI (it hands us the USB fd
# from UsbManager; see src/jni.rs and the `--from-fd` path).
[lib]
name = "usbwire_server"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "usbwire-server"
path = "src/main.rs"

[dependencies]
usbwire-proto.workspace = true
usbwire-net.workspace = true
quinn.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bytes.workspace = true
nusb.workspace = true
serde.workspace = true
serde_json.workspace = true
humantime.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
winswap = { path = "../winswap" }
windows-service.workspace = true

# Android: JNI entry point and a file-backed tracing log the app can display.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tracing-appender = "0.2"
